server:
  servlet:
    context-path: /organicfood/api/v1
  tomcat:
    accept-count: 300

spring:
  application:
    name: organic-food
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        default_batch_fetch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    issuer: minn-dev.ticketbooking.com
    access-validity: 15m
    refresh-validity: 7d

  rsa:
    private-key: classpath:certs/private.pem
    public-key: classpath:certs/public.pem

  security:
    public-endpoints:
      - method: GET
        pattern: /connect
      - method: POST
        pattern: /auth/login
      - method: POST
        pattern: /auth/register
      - method: POST
        pattern: /auth/register/verify
      - method: POST
        pattern: /auth/register/resend-otp
      - method: POST
        pattern: /auth/token/refresh
      - method: GET
        pattern: /categories/**
      - method: GET
        pattern: /vouchers/**
      - method: GET
        pattern: /products/**
      - method: GET
        pattern: /brands/**